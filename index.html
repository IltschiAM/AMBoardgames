<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athletic Maniacs’ Board Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--rot:#d62839;--blau:#1d4ed8;--bahn:#b8472c;--rasen:#2f6f3e;--papier:#f1f3ee;--tinte:#17202a}
*{box-sizing:border-box}
body{margin:0;background:var(--papier);color:var(--tinte);font:16px/1.4 Barlow,system-ui,sans-serif}
h1{font:italic 800 1.8rem 'Barlow Condensed',Impact,sans-serif;margin:0}
header{background:var(--rasen);color:#fff;padding:14px 16px 12px;border-bottom:6px solid var(--bahn)}
header select{width:auto;margin:6px 0 0;padding:6px 10px}
#stat{display:flex;gap:6px 16px;flex-wrap:wrap;font-weight:600;margin-top:4px}
main{max-width:560px;margin:0 auto;padding:14px}
input,select,button{font:inherit;padding:12px;border-radius:6px;border:2px solid var(--tinte);width:100%;margin:0 0 10px;background:#fff}
button{background:var(--tinte);color:#fff;font-weight:600;cursor:pointer}
button.zweit{background:#fff;color:var(--tinte)}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--blau);outline-offset:2px}
#wurf{font:italic 800 4rem/1 'Barlow Condensed',Impact,sans-serif;text-align:center;margin:4px 0 8px}
#log{min-height:3em;font-weight:600}
#fehler{color:var(--rot);font-weight:600}
#brett{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:var(--bahn);padding:4px;border-radius:8px}
.f{aspect-ratio:1;background:#fff8f0;font-size:.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:3px}
.f b{font-size:.85rem;line-height:1}
.G{background:#c7f0d0}.P{background:#d9d9e8}.Q{background:#ffe9a8}.ZW,.ZP,.S{background:#ffd1d9}.L,.B,.W{background:#cfe3ff}
.f.ich{outline:3px solid var(--tinte);position:relative;z-index:1;font-weight:800}
.rot .f.ich{background:var(--rot);color:#fff}.blau .f.ich{background:var(--blau);color:#fff}
.hide{display:none}
</style>
</head>
<body>
<header><h1 id="h1"></h1><select id="lang" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option></select><div id="stat"></div></header>
<main>
<section id="login">
<input id="n" data-p="name" autocomplete="username">
<input id="p" type="password" data-p="pw" autocomplete="current-password">
<button id="bin" data-i="login"></button>
<p data-i="neu"></p>
<input id="c" data-p="code">
<select id="t"><option value="rot" data-i="rot"></option><option value="blau" data-i="blau"></option></select>
<button class="zweit" id="breg" data-i="reg"></button>
</section>
<section id="spiel" class="hide">
<div id="wurf">-</div>
<button id="bw" data-i="roll"></button>
<p id="log"></p>
<div id="brett"></div>
</section>
<p id="fehler" role="alert"></p>
</main>
<script src="spiel.js"></script>
</body>
</html>
